aid: starship
name: Starship Technologies
description: 'Starship Technologies is an autonomous last-mile delivery company that operates a
  global fleet of self-driving, sidewalk-going delivery robots. Founded in 2014 by Skype co-founders
  Ahti Heinla and Janus Friis, the company runs commercial robot delivery on university campuses,
  in residential neighborhoods, on industrial sites and for grocery and restaurant partners across
  the United States, the United Kingdom, Estonia, Finland, Germany and Denmark, and has completed
  more than 10 million autonomous deliveries. Its commercial product, Delivery by Starship, is a
  delivery-as-a-service offering that partners integrate into their own ordering apps: Starship
  states that its APIs let a partner create delivery jobs, load robots, obtain status updates and
  handle delivery cancellations, backed by a developer toolkit, documentation, ready-made components
  and support. That developer surface is not published to the open web — Starship provides it to
  partners after a commercial conversation via business@starship.co, so no public specification,
  reference or portal exists to profile.'
